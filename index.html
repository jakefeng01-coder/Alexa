<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine? 💌</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <canvas id="fx"></canvas>

  <main class="wrap">
    <div class="card" aria-live="polite">
      <div class="badge">💘 Valentine Invite</div>

      <h1 class="title">
        Will you be my <span class="accent">Valentine</span>?
      </h1>

      <p class="subtitle">
        I promise: cute dates, random snacks, and me being a little bit obsessed (respectfully).
      </p>

      <div class="buttons">
        <button id="yes" class="btn btn-yes">
          Yes 💖
        </button>

        <button id="no" class="btn btn-no">
          No 🙃
        </button>
      </div>

      <div id="result" class="result hidden">
        <div class="result-inner">
          <div class="big">YAY!!! 🥰</div>
          <div class="small">You just made my whole week 💞</div>
          <div class="chip">Screenshot this and send it to me 😈</div>
        </div>
      </div>

      <footer class="footer">
        <span class="dot"></span> made with love
      </footer>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
